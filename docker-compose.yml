services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    container_name: sentinel_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_PROXY_TARGET: http://core:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dmz_net
      - sentinel_net
    depends_on:
      - core

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: sentinel_core
    ports:
      - "8000:8000"
    environment:
      # Variables de entorno para el Core Orchestrator
      # Se pueden cargar desde un archivo .env en producción
      WINDOW_THRESHOLD_REQUESTS: ${WINDOW_THRESHOLD_REQUESTS}
      WINDOW_DURATION_SECONDS: ${WINDOW_DURATION_SECONDS}
      MAX_ALERTS_IN_MEMORY: ${MAX_ALERTS_IN_MEMORY}
      APP_ENV: ${APP_ENV:-development}
      SECRET_SOURCE: ${SECRET_SOURCE:-env}
      SECRET_ROTATION_DAYS: ${SECRET_ROTATION_DAYS:-30}
      REQUIRE_HTTPS_IN_PRODUCTION: ${REQUIRE_HTTPS_IN_PRODUCTION:-true}

      # Configuración de base de datos (ejemplos, ajustar según necesidad)
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      RULES_MONGO_DB_NAME: ${RULES_MONGO_DB_NAME:-heuristy}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BOOTSTRAP_ON_STARTUP: ${BOOTSTRAP_ON_STARTUP:-true}
      # --- Configuración de Tenants ---
      ENFORCE_TENANT_AUTH: ${ENFORCE_TENANT_AUTH:-false}
      DEFAULT_TENANT_RATE: ${DEFAULT_TENANT_RATE:-60}
      # Configuración del MCP Server
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"

    networks:
      - sentinel_net
      - log_net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mcp_server:
        condition: service_started
    volumes:
      # Mapea tu carpeta local con los seeds hacia la ruta interna /data del contenedor
      - core_data:/data

  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: sentinel_mcp_server
    ports:
      - "8080:8080"
    environment:
      # Variables de entorno para el Log Analysis Server (MCP)

      APP_ENV: ${APP_ENV:-development}
      SECRET_SOURCE: ${SECRET_SOURCE:-env}
      REQUIRE_HTTPS_IN_PRODUCTION: ${REQUIRE_HTTPS_IN_PRODUCTION:-true}
      MCP_SERVER_HOST: 0.0.0.0 # Escucha en todas las interfaces dentro del contenedor
      MCP_SERVER_PORT: 8080
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN}
      MCP_INTERNAL_SIGNING_TOKEN: ${MCP_INTERNAL_SIGNING_TOKEN}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-sentinel_soa}
      MCP_INTERNAL_TOKEN_ADMIN: ${MCP_INTERNAL_TOKEN_ADMIN}
      MCP_INTERNAL_TOKEN_ANALYST: ${MCP_INTERNAL_TOKEN_ANALYST}
      MCP_INTERNAL_TOKEN_VIEWER: ${MCP_INTERNAL_TOKEN_VIEWER}
      MCP_INTERNAL_TOKENS_ADMIN: ${MCP_INTERNAL_TOKENS_ADMIN}
      MCP_INTERNAL_TOKENS_ANALYST: ${MCP_INTERNAL_TOKENS_ANALYST}
      MCP_INTERNAL_TOKENS_VIEWER: ${MCP_INTERNAL_TOKENS_VIEWER}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"

    networks:
      - sentinel_net
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy


  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: sentinel_ollama
    ports:
      - "11434:11434" # Puerto por defecto de Ollama
    networks:
      - sentinel_net
    volumes:
      - ollama_data:/root/.ollama # Persistir modelos
    # command: ollama serve # El Dockerfile ya lo inicia
  
  attacker:
    build:
      context: .
      dockerfile: Dockerfile.attacker
    container_name: sentinel_attacker
    networks:
      - dmz_net

  victim_app:
    build:
      context: . # El contexto es la raíz del proyecto
      dockerfile: Dockerfile.victim # El Dockerfile está en la raíz
    container_name: sentinel_victim_app
    ports:
      - "8001:8001"
    environment:
      VICTIM_SOURCE_ID: ${VICTIM_SOURCE_ID}
      TELEMETRY_FORWARD_URL: ${TELEMETRY_FORWARD_URL}
      TELEMETRY_HMAC_PUBLIC_KEY: ${TELEMETRY_HMAC_PUBLIC_KEY}
      TELEMETRY_HMAC_SECRET: ${TELEMETRY_HMAC_SECRET}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN}
    networks:
      - dmz_net
      - log_net
    volumes:
      - victim_logs:/var/log/victim_app # Montar volumen para logs

  log_shipper:
    image: timberio/vector:0.38.0-alpine # Imagen estable y ligera de Vector basada en Alpine
    container_name: sentinel_log_shipper_vector
    command: ["--config", "/etc/vector/vector.toml"] # Forzar el uso del archivo de config .toml
    environment:
      TELEMETRY_FORWARD_URL: ${TELEMETRY_FORWARD_URL}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID}
      SENTINEL_API_KEY: ${SENTINEL_API_KEY}
      SENTINEL_HMAC_SECRET: ${SENTINEL_HMAC_SECRET}
    volumes:
      # Mapeo del archivo de configuración nativo TOML desde tu host al contenedor
      - ./victim_app/vector.toml:/etc/vector/vector.toml:ro
      
      # Mapeo del volumen de logs de la app víctima en modo solo lectura
      - victim_logs:/var/log/victim_app:ro
    networks:
      - dmz_net
      - log_net
    depends_on:
      - victim_app
      - core # Garantiza que el Core Orchestrator esté corriendo para recibir los HTTP POST
  mongo:
      image: mongo:latest
      container_name: sentinel_mongodb
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/data/db
      environment:
        - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
        - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      networks:
        - sentinel_net
      healthcheck:
        # Se comprueba que el servidor responde y que la autenticación es exitosa.
        test: ["CMD-SHELL", "mongosh --username $$MONGO_USER --password $$MONGO_PASSWORD --authenticationDatabase admin --quiet --eval 'db.adminCommand(\"ping\")'"]
        interval: 10s
        timeout: 10s
        retries: 5
        start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Inicia Redis con una contraseña requerida para todas las operaciones.
    command: redis-server --requirepass ${REDIS_PASSWORD} --notify-keyspace-events KEA
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26.0-community
    container_name: sentinel_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser UI (solo dev)
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"

    volumes:
      - neo4j_data:/data
    networks:
      - sentinel_net
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1'" ]
      interval: 15s
      timeout: 10s
      retries: 5

networks:
  sentinel_net:
    driver: bridge
  dmz_net:
    driver: bridge
  log_net:
    driver: bridge

volumes:
  core_data:
  victim_logs:
  ollama_data:
  mongo_data:
  redis_data:
  neo4j_data: