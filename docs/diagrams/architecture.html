  <script>
        // Hover highlighting
        const nodes = document.querySelectorAll('.node');
        const allPaths = document.querySelectorAll('#connections > *');

        nodes.forEach(node => {
            node.addEventListener('mouseenter', () => {
                const activePaths = (node.dataset.paths || '').split(',');
                allPaths.forEach(p => {
                    if (p.id && activePaths.includes(p.id)) {
                        p.classList.add('highlighted');
                        p.classList.remove('dimmed');
                        p.style.opacity = '1';
                        p.style.strokeWidth = parseFloat(getComputedStyle(p).strokeWidth) + 1 + 'px';
                    } else if (p.id) {
                        p.classList.add('dimmed');
                        p.classList.remove('highlighted');
                    }
                });
            });
            node.addEventListener('mouseleave', () => {
                allPaths.forEach(p => {
                    p.classList.remove('dimmed', 'highlighted');
                    p.style.opacity = '';
                    p.style.strokeWidth = '';
                });
            });
        });

        // Animated particles
        const particlesG = document.getElementById('particles');
        const particleDefs = [
            { path: 'path-atk-victim', color: '#ff4444', speed: 1200 },
            { path: 'path-victim-api', color: '#ff8800', speed: 2000 },
            { path: 'path-api-redis', color: '#00eeff', speed: 800 },
            { path: 'path-api-mcp', color: '#b44dff', speed: 1800 },
            { path: 'path-api-dashboard', color: '#00ff88', speed: 2200 },
            { path: 'path-mcp-ollama', color: '#cc66ff', speed: 1500 },
            { path: 'path-chat-mcp', color: '#44ffaa', speed: 2500 },
        ];

        particleDefs.forEach(def => {
            const line = document.getElementById(def.path);
            if (!line) return;
            const x1 = +line.getAttribute('x1'), y1 = +line.getAttribute('y1');
            const x2 = +line.getAttribute('x2'), y2 = +line.getAttribute('y2');

            for (let i = 0; i < 3; i++) {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('r', '3');
                circle.setAttribute('fill', def.color);
                circle.classList.add('particle');
                circle.style.animationDelay = (i * def.speed / 3) + 'ms';
                particlesG.appendChild(circle);

                let start = null;
                const offset = (i / 3) * def.speed;
                function animate(ts) {
                    if (!start) start = ts;
                    const t = ((ts - start + offset) % def.speed) / def.speed;
                    circle.setAttribute('cx', x1 + (x2 - x1) * t);
                    circle.setAttribute('cy', y1 + (y2 - y1) * t);
                    requestAnimationFrame(animate);
                }
                requestAnimationFrame(animate);
            }
        });
    </script>
